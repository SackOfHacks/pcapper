[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcapper"
version = "2.2.0"
description = "Modular PCAP threat-hunting, forensics & incident-response/triage CLI for IT and OT/ICS networks"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "pcap",
    "network",
    "forensics",
    "security",
    "threat-hunting",
    "incident-response",
    "dfir",
    "ot",
    "ics",
    "scada",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
urls = { Homepage = "https://github.com/SackOfHacks/pcapper", Repository = "https://github.com/SackOfHacks/pcapper", Issues = "https://github.com/SackOfHacks/pcapper/issues" }
dependencies = [
    "cryptography>=42.0.0",
    "dpkt>=1.9.8",
    "geoip2>=4.7.0",
    "pydicom>=2.4.4",
    "scapy>=2.5.0",
    "tomli>=2.0.1; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]

[project.scripts]
pcapper = "pcapper.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# Match the floor advertised in requires-python, so a 3.10+ construct is caught
# here rather than by a user on the oldest supported interpreter.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# `F` is the pyflakes rule set. Every confirmed defect in the 2026-09 review was
# in it, including a duplicate nested helper that silently changed SMB output.
# Widen this deliberately; do not narrow it.
select = ["F"]

[tool.setuptools]
packages = ["pcapper"]
include-package-data = true

[tool.setuptools.package-data]
pcapper = ["*.json"]
