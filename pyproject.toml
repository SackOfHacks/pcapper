[build-system]
# 77: license as an SPDX expression (PEP 639) with license-files; setuptools
# builds wheels itself since 70.1, so "wheel" is no longer a build requirement.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcapper"
# Read from pcapper/__init__.py so there is exactly one source of truth.
# See [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "PCAP forensics and threat hunting for IT and OT/ICS networks: triage, incident response and protocol deep dives from one CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "pcap",
    "pcapng",
    "network",
    "forensics",
    "security",
    "threat-hunting",
    "incident-response",
    "dfir",
    "ot",
    "ics",
    "scada",
    "modbus",
    "dnp3",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "cryptography>=42.0.0",
    "dpkt>=1.9.8",
    "geoip2>=4.7.0",
    "pydicom>=2.4.4",
    "scapy>=2.5.0",
    "tomli>=2.0.1; python_version < \"3.11\"",
]

[project.urls]
Homepage = "https://github.com/SackOfHacks/pcapper"
Repository = "https://github.com/SackOfHacks/pcapper"
Changelog = "https://github.com/SackOfHacks/pcapper/blob/main/CHANGELOG.md"
Issues = "https://github.com/SackOfHacks/pcapper/issues"
Security = "https://github.com/SackOfHacks/pcapper/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]

[project.scripts]
pcapper = "pcapper.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: spawns subprocesses; ~30s. Deselect with -m 'not slow'.",
]

[tool.ruff]
# Match the floor advertised in requires-python, so a 3.10+ construct is caught
# here rather than by a user on the oldest supported interpreter.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# `F` is the pyflakes rule set. Every confirmed defect in the 2026-09 review was
# in it, including a duplicate nested helper that silently changed SMB output.
# Widen this deliberately; do not narrow it.
select = ["F"]

[tool.setuptools]
# pcapper.reporting is a subpackage since the reporting split; listing only
# "pcapper" builds a wheel with every renderer missing.
packages = ["pcapper", "pcapper.reporting"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pcapper.__version__" }

[tool.setuptools.package-data]
pcapper = ["*.json"]
