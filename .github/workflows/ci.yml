name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # --select F is the pyflakes rule set: undefined names, unused and
      # duplicated imports, and redefinitions. Every confirmed defect in the
      # 2026-09 review was in this set, including a duplicate nested helper that
      # silently changed SMB output. Keep this gate; widen it deliberately.
      - name: ruff check (pyflakes rules)
        run: ruff check --select F pcapper/ tests/

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range pyproject.toml advertises. Nothing verified
        # either bound before this workflow existed.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Byte-compile
        run: python -m compileall -q pcapper/
      - name: Import every module
        # compileall proves the syntax parses on this interpreter; this proves
        # the imports actually resolve, which is what a stale re-export breaks.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import pcapper
          failures = []
          for module in sorted(m.name for m in pkgutil.iter_modules(pcapper.__path__)):
              try:
                  importlib.import_module(f"pcapper.{module}")
              except Exception as exc:
                  failures.append(f"{module}: {type(exc).__name__}: {exc}")
          for failure in failures:
              print(failure, file=sys.stderr)
          sys.exit(1 if failures else 0)
          PY
      - name: Test
        run: pytest -q

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      # twine check validates metadata, not contents. It passed for the whole
      # window in which the wheel shipped no reporting package at all and
      # `import pcapper.cli` raised ModuleNotFoundError. Install the artifact
      # into a clean environment and actually run it.
      - name: Install the built wheel and run it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/python -m pip install --quiet --upgrade pip
          /tmp/wheeltest/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheeltest/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import pcapper, pcapper.cli
          print("installed version:", pcapper.__version__)
          # Every module in the source tree must be present in the wheel.
          missing = []
          for finder, name, _ in pkgutil.walk_packages(
              pcapper.__path__, prefix="pcapper."
          ):
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  missing.append(f"{name}: {type(exc).__name__}: {exc}")
          for item in missing:
              print(item, file=sys.stderr)
          sys.exit(1 if missing else 0)
          PY
          /tmp/wheeltest/bin/pcapper --self-check || true
          /tmp/wheeltest/bin/pcapper 2>&1 | grep -F "PCAPPER v$(/tmp/wheeltest/bin/python -c 'import pcapper; print(pcapper.__version__)')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
