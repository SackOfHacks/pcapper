name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # --select F is the pyflakes rule set: undefined names, unused and
      # duplicated imports, and redefinitions. Every confirmed defect in the
      # 2026-09 review was in this set, including a duplicate nested helper that
      # silently changed SMB output. Keep this gate; widen it deliberately.
      - name: ruff check (pyflakes rules)
        run: ruff check --select F pcapper/ tests/

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range pyproject.toml advertises. Nothing verified
        # either bound before this workflow existed.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Byte-compile
        run: python -m compileall -q pcapper/
      - name: Import every module
        # compileall proves the syntax parses on this interpreter; this proves
        # the imports actually resolve, which is what a stale re-export breaks.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import pcapper
          failures = []
          for module in sorted(m.name for m in pkgutil.iter_modules(pcapper.__path__)):
              try:
                  importlib.import_module(f"pcapper.{module}")
              except Exception as exc:
                  failures.append(f"{module}: {type(exc).__name__}: {exc}")
          for failure in failures:
              print(failure, file=sys.stderr)
          sys.exit(1 if failures else 0)
          PY
      - name: Test
        run: pytest -q

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
